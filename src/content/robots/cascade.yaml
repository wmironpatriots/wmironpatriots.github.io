name: Cascade
year: '2025'
game: reefscape
description: >-
  Cascade is a 105 lb robot designed for the 2025 FRC competition. It has a
  full-width chute, a 2 stage cascade elevator, and a pivoting end effector.
  Cascade was rank 8 at the Hudson Valley Regional and rank 21 at the Long
  Island Regional in 2025.
